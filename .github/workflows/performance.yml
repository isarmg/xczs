name: Large-directory performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  SERVER_TARGET: "x86_64-unknown-linux-gnu"
  CARGO_TERM_COLOR: always
  XCZS_BENCHMARK_MAX_MILLIS: "30000"

jobs:
  large-directory:
    name: 100,000-entry first page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Build the embedded Web assets required by build.rs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the fixed Leptos browser compiler
        run: bash scripts/install-leptos-tools.sh
      - name: Install locked Web dependencies and build platform assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:platform
      - name: Record the benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          uname -a
          rustc +"$RUST_TOOLCHAIN" --version --verbose
      - name: Enforce the large-directory baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --locked --release --target "$SERVER_TARGET" \
            --test pagination benchmark_one_hundred_thousand_entries \
            -- --ignored --exact --nocapture
