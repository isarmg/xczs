name: Read-only CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  SERVER_TARGET: "x86_64-unknown-linux-gnu"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  CARGO_LLVM_COV_VERSION: "0.8.6"
  CARGO_LLVM_COV_SHA256: "eff7a72a3432ef18956a7f7424f87f7d08b30f465c79e1f03baeee17f7ccb960"
  CARGO_TERM_COLOR: always
  CI: "1"

jobs:
  classify:
    name: Classify pull request paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_sensitive: ${{ steps.paths.outputs.release_sensitive }}
    steps:
      - name: Check out pull request history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect deployment and release changes
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ || \
            ! "$HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          then
            printf 'Pull request source identities are invalid.\n' >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          release_sensitive=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*|systemd/*|libexec/*|config/*|install.sh|\
              scripts/check-deployment.sh|scripts/check-formal-release-e2e.sh|\
              scripts/check-release.sh|scripts/check-release-runtime.sh|\
              scripts/package-release.sh|scripts/*installed*|scripts/*inventory-tools.py|config/xssi.lock|\
              tools/web-build/*|web/rust-web.toml|web/vendor/*|Cargo.toml|Cargo.lock|web/xcss-web/Cargo.toml|web/xcss-web/Cargo.lock|web/xcss-web/vendor/*|build.rs|package.json|package-lock.json)
                release_sensitive=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          printf 'release_sensitive=%s\n' "$release_sensitive" >> "$GITHUB_OUTPUT"

  static:
    name: Static sources and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the fixed Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the checksum-pinned ShellCheck binary
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          install_dir="${RUNNER_TEMP}/shellcheck"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar --no-same-owner -xJf "$archive" -C "$install_dir"
          printf '%s\n' "$install_dir/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Record the static-analysis environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          uname -a
          node --version
          npm --version
          git --version
          bash --version | sed -n '1p'
          shellcheck --version
      - name: Install the fixed xcss-web browser compiler
        run: bash scripts/install-xcss-web-tools.sh
      - name: Install and record locked JavaScript tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
      - name: Check Shell sources
        shell: bash
        run: |
          set -euo pipefail
          XCZS_REQUIRE_SHELLCHECK=1 ./scripts/check-shell.sh
      - name: Check JavaScript and Markdown
        run: |
          node scripts/check-release-workflow.mjs
          node --test scripts/check-ci-parallelism.test.mjs
          npm run check:js
          npm run check:types
          python3 -B scripts/test-xcss-web-build.py
          npm run check:docs
          npm run check:independence
          npm run test:frontend:unit
      - name: Verify checks did not alter tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy \
            --component rustfmt
      - name: Record the Rust environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          uname -a
          rustc +"$RUST_TOOLCHAIN" --version --verbose
          cargo +"$RUST_TOOLCHAIN" --version --verbose
          test "$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = \
            "$SERVER_TARGET"
      - name: Install the xcss Node baseline for embedded assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the fixed xcss-web browser compiler
        run: bash scripts/install-xcss-web-tools.sh
      - name: Build embedded xcss-web platform assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
      - name: Run Rust gates
        shell: bash
        env:
          XCZS_SOURCE_REVISION: unbound
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" fmt --all --check
          cargo +"$RUST_TOOLCHAIN" clippy --locked --target "$SERVER_TARGET" --all-targets --all-features -- -D warnings
          cargo +"$RUST_TOOLCHAIN" test --locked --target "$SERVER_TARGET" --all-targets --all-features

  browser_rust:
    name: xcss-web Rust format, lint, and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fixed Rust browser toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check the independent browser workspace
        run: |
          cargo +1.99.0 fmt --manifest-path tools/web-build/Cargo.toml -- --check
          cargo +1.99.0 clippy --manifest-path tools/web-build/Cargo.toml --locked --all-targets -- -D warnings
          cargo +"$RUST_TOOLCHAIN" fmt --manifest-path web/xcss-web/Cargo.toml --all --check
          cargo +"$RUST_TOOLCHAIN" clippy --manifest-path web/xcss-web/Cargo.toml --locked --target wasm32-unknown-unknown --all-targets --no-deps -- -D warnings
          cargo +"$RUST_TOOLCHAIN" test --manifest-path web/xcss-web/Cargo.toml --locked --lib
          python3 -B scripts/test-xcss-web-build.py

  coverage:
    name: Coverage
    needs: classify
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.release_sensitive == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out the source without credentials
        id: quality_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the fixed Node.js release
        id: quality_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the fixed Rust toolchain
        id: quality_rust
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component llvm-tools-preview
      - name: Install the checksum-pinned coverage tool
        id: coverage_tool
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_rust.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-llvm-cov.tar.gz"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$CARGO_LLVM_COV_SHA256" "$archive" | sha256sum --check
          install -d -m 0755 "$cargo_bin"
          tar --no-same-owner -xzf "$archive" -C "$cargo_bin" cargo-llvm-cov
          chmod 0755 "$cargo_bin/cargo-llvm-cov"
          cargo llvm-cov --version
      - name: Install the fixed xcss-web browser compiler
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_rust.outcome == 'success' && steps.coverage_tool.outcome == 'success' }}
        run: bash scripts/install-xcss-web-tools.sh
      - name: Run coverage checks
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_rust.outcome == 'success' && steps.coverage_tool.outcome == 'success' }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          XCZS_SOURCE_REVISION: unbound
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
          ./scripts/check-coverage.sh

  release_smoke:
    name: Deployment and release smoke
    env:
      CARGO_INCREMENTAL: "0"
    needs: classify
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.release_sensitive == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out the source without credentials
        id: quality_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the fixed Node.js release
        id: quality_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the fixed Rust toolchain
        id: quality_rust
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal
      - name: Identify the exact release compilation environment
        id: release_rust_environment
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          set -euo pipefail
          # Missing image identity must not merge unrelated hosted environments.
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          fingerprint="$({
            printf '%s\n' "$ImageOS" "$ImageVersion"
            rustc --version --verbose
            cargo --version --verbose
            env | LC_ALL=C sort | grep -E '^(CARGO_|RUST|CC=|CXX=|CFLAGS=|CXXFLAGS=|LDFLAGS=|AR=|HOST_|TARGET_|SOURCE_DATE_EPOCH=)' || true
          } | sha256sum | cut -d ' ' -f 1)"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore exact release Rust dependencies
        id: release_rust_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          # No prefix fallback: profile, flags, installer pin and build contract
          # changes invalidate this lane. GitHub scopes PR reads to their base;
          # only a successful main push may populate this cache below.
          key: xczs-release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ env.SERVER_TARGET }}-debug-release-${{ steps.release_rust_environment.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'tools/web-build/Cargo.lock', 'tools/web-build/src/**', 'web/rust-web.toml', 'web/vendor/**', 'web/xcss-web/vendor/**', 'web/xcss-web/Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/**', 'config/xssi.lock', 'package.json', 'package-lock.json', 'xcss-web-build.json', '.github/workflows/read-only-ci.yml') }}
      - name: Discard cached candidate products before real compilation
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep third-party dependencies, never treat a cached xczs as the
          # current candidate. Clean both the host test and explicit release target.
          cargo clean --package xczs
          cargo clean --package xczs --release --target "$SERVER_TARGET"
      - name: Cache exact source-built inventory tools
        id: inventory_tools
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/inventory-tools
          key: xczs-inventory-tools-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-audit-0.22.2-cyclonedx-0.5.9-${{ hashFiles('scripts/ci-inventory-tools.py') }}
      - name: Prepare pinned real installer and inventory tools
        id: install_tools
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          INVENTORY_CACHE_HIT: ${{ steps.inventory_tools.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -B scripts/test-ci-inventory-tools.py
          python3 -B scripts/ci-inventory-tools.py --root "$RUNNER_TEMP/inventory-tools" --cache-hit "$INVENTORY_CACHE_HIT"
          revision="$(sed -n 's/^git_rev=//p' config/xssi.lock)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$RUNNER_TEMP/install-xssi"
          git -C "$RUNNER_TEMP/install-xssi" remote add origin https://github.com/isarmg/xssi.git
          git -C "$RUNNER_TEMP/install-xssi" fetch --quiet --depth=1 origin "$revision"
          git -C "$RUNNER_TEMP/install-xssi" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$RUNNER_TEMP/install-xssi" rev-parse HEAD)" == "$revision" ]]
          mkdir -m 0700 "$RUNNER_TEMP/install-metadata"
      - name: Save verified inventory tools before testing the candidate
        if: ${{ steps.inventory_tools.outputs.cache-hit != 'true' && steps.install_tools.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/inventory-tools
          key: ${{ steps.inventory_tools.outputs.cache-primary-key }}
      - name: Install the fixed xcss-web browser compiler
        run: bash scripts/install-xcss-web-tools.sh
      - name: Build embedded xcss-web platform assets
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_node.outcome == 'success' }}
        id: release_assets
        env:
          XSSI_BUILD_TOOLS_DIR: ${{ runner.temp }}/install-xssi
          XSSI_FRONTEND_METADATA_FILE: ${{ runner.temp }}/install-metadata/frontend.json
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
      - name: Install deployment validator when absent
        id: deployment_validator
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_node.outcome == 'success' && steps.quality_rust.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          systemd-analyze --version | sed -n '1p'
      - name: Run deployment checks
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_node.outcome == 'success' && steps.quality_rust.outcome == 'success' && steps.deployment_validator.outcome == 'success' }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          XCZS_SOURCE_REVISION: unbound
        run: |
          set -euo pipefail
          ./scripts/check-deployment.sh
      - name: Build and execute the release binary
        id: release_binary
        if: ${{ !cancelled() && steps.quality_source.outcome == 'success' && steps.quality_rust.outcome == 'success' && steps.release_assets.outcome == 'success' }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          XSSI_BUILD_METADATA_DIR="$RUNNER_TEMP/install-metadata" cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- server --product-root . --config xcss-web-build.json --mode release --rust-only
          "./target/$SERVER_TARGET/release/xczs" --version | grep -F "xczs "
          bash scripts/check-release-runtime.sh "$GITHUB_WORKSPACE/target/$SERVER_TARGET/release/xczs"

      - name: Save compiled Rust dependencies before installation tests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_rust_cache.outputs.cache-hit != 'true' && steps.release_binary.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ steps.release_rust_cache.outputs.cache-primary-key }}
      - name: Package and exercise the already-built installed candidate
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/test-installed-lifecycle.py
          bash scripts/package-installed-candidate.sh \
            "$GITHUB_WORKSPACE/target/$SERVER_TARGET/release/xczs" \
            "$RUNNER_TEMP/install-metadata" "$RUNNER_TEMP/install-xssi" "$RUNNER_TEMP/install-candidate"
          candidates=("$RUNNER_TEMP/install-candidate"/xczs-*-linux-x86_64.tar.gz)
          [[ ${#candidates[@]} == 1 && -f "${candidates[0]}" ]]
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            LIFECYCLE_DIAGNOSTICS="$RUNNER_TEMP/install-diagnostics" \
            python3 -I -B scripts/check-installed-lifecycle.py "${candidates[0]}" "$GITHUB_SHA"
      - name: Retain redacted installation lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/install-diagnostics
          if-no-files-found: ignore
          retention-days: 3

  quality:
    name: Coverage, deployment, and release smoke
    needs: [classify, coverage, release_smoke]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable quality gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_SENSITIVE: ${{ needs.classify.outputs.release_sensitive }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_RESULT: ${{ needs.release_smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$CLASSIFY_RESULT" == success ]]
            case "$RELEASE_SENSITIVE" in
              false)
                [[ "$COVERAGE_RESULT" == skipped && "$RELEASE_RESULT" == skipped ]]
                exit 0
                ;;
              true) ;;
              *) exit 1 ;;
            esac
          fi
          [[ "$COVERAGE_RESULT" == success && "$RELEASE_RESULT" == success ]]

  browser_tests:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1
            shards: 1
          - browser: firefox
            shard: 1
            shards: 2
          - browser: firefox
            shard: 2
            shards: 2
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the fixed Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Record the browser-test environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          uname -a
          node --version
          npm --version
          rustc +"$RUST_TOOLCHAIN" --version
          cargo +"$RUST_TOOLCHAIN" --version
      - name: Install the fixed xcss-web browser compiler
        run: bash scripts/install-xcss-web-tools.sh
      - name: Install locked JavaScript tools and browser
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright --version
          ./node_modules/.bin/playwright install --with-deps "$BROWSER"
      - name: Build the candidate and run the isolated browser project
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: node scripts/build-frontend-candidate.mjs --project="$BROWSER" --shard="$SHARD/$SHARDS"
      - name: Preserve browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  browser:
    # Keep both existing required check names. Each aggregate deliberately
    # requires the complete browser matrix so no failed shard can be hidden.
    name: Browser (${{ matrix.browser }})
    needs: browser_tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Require every browser shard
        shell: bash
        env:
          BROWSER_RESULT: ${{ needs.browser_tests.result }}
        run: |
          set -euo pipefail
          [[ "$BROWSER_RESULT" == success ]]
