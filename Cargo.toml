[package]
name = "xczs"
version = "1.0.3"
edition = "2024"
rust-version = "1.99"
description = "A Linux browser file manager"
authors = ["sigoden <sigoden@gmail.com>", "xczs developers"]
license = "Apache-2.0"
homepage = "https://github.com/isarmg/xczs"
repository = "https://github.com/isarmg/xczs"
publish = false
build = "build.rs"

[dependencies]
hex = "=0.4.3"
thiserror = "=2.0.21"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "53c24a2bc026b3c09e073f18cd26b01d15d6d354", version = "=1.0.11", features = ["tracing"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
http = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
clap = { version = "4.6.7", features = ["wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net", "time"]}
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
headers = "0.4"
mime_guess = "2.0"
uuid = { version = "1.7", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
form_urlencoded = "1.2"
alphanumeric-sort = "1.4"
anyhow = "1.0"
rustix = { version = "1.1.5", features = ["event", "fs", "process", "time"] }
base64 = "0.23.1"
http-body-util = "0.1"
bytes = "1.5"
getrandom = "0.4"
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3"

[build-dependencies]
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "53c24a2bc026b3c09e073f18cd26b01d15d6d354", version = "=1.0.11" }

[dev-dependencies]
socket2 = "0.6"
assert_cmd = "2"
reqwest = { version = "0.13.5", features = ["blocking"], default-features = false }
assert_fs = "1"
indexmap = "2.2"
rstest = "0.26.1"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
