[package]
name = "xczs-web"
version = "1.0.1"
edition = "2024"
publish = false

[workspace]
exclude = ["vendor/xcss-web"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
xcss-web = { path = "vendor/xcss-web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "Navigator", "HtmlElement", "HtmlInputElement", "HtmlFormElement", "HtmlSelectElement", "HtmlOptionsCollection", "HtmlOptionElement", "HtmlTemplateElement", "HtmlDialogElement", "DocumentFragment", "Element", "Event", "EventTarget", "KeyboardEvent", "FocusEvent", "MouseEvent", "DragEvent", "DataTransfer", "DomTokenList", "File", "FileList", "Blob", "BlobPropertyBag", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "FormData", "Url", "UrlSearchParams", "Crypto", "Storage", "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestEventTarget", "ProgressEvent", "BeforeUnloadEvent", "CustomEvent", "CustomEventInit", "CssStyleDeclaration", "DomRect", "Node", "Text", "console"] }

[profile.release]
opt-level = "s"
lto = true
debug = 0
codegen-units = 1
panic = "abort"
strip = true

# The integrated xcss snapshot owns both CSR runtime and host macros.
[patch.crates-io]
leptos = { path = "vendor/xcss-web/vendor/leptos-csr" }
leptos_macro = { path = "vendor/xcss-web/vendor/leptos-macro-csr" }
